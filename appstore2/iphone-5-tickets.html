<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1290px; height:2796px; overflow:hidden; background:#0a0900; font-family:-apple-system,'Helvetica Neue',sans-serif; -webkit-font-smoothing:antialiased; position:relative; }
  .bg { position:absolute; inset:0; overflow:hidden; }
  .orb { position:absolute; border-radius:50%; filter:blur(140px); }
  .o1 { width:700px; height:700px; background:#f59e0b; opacity:0.2; top:-100px; left:-100px; }
  .o2 { width:600px; height:600px; background:#ef4444; opacity:0.12; top:500px; right:-80px; }
  .o3 { width:500px; height:500px; background:#d97706; opacity:0.15; bottom:200px; left:150px; }
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(245,158,11,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,0.03) 1px,transparent 1px); background-size:80px 80px; }
  .content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; height:100%; }
  .badge { margin-top:130px; display:inline-flex; align-items:center; gap:12px; background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.3); padding:12px 30px; border-radius:100px; font-size:26px; font-weight:700; letter-spacing:2px; color:#fcd34d; text-transform:uppercase; }
  .badge-dot { width:10px; height:10px; background:#f59e0b; border-radius:50%; }
  .headline { margin-top:50px; text-align:center; font-size:120px; font-weight:900; line-height:1.0; letter-spacing:-5px; color:#fff; max-width:1100px; }
  .headline em { font-style:normal; background:linear-gradient(135deg,#fcd34d 0%,#f59e0b 50%,#ef4444 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .sub { margin-top:38px; font-size:40px; font-weight:400; color:rgba(255,255,255,0.65); text-align:center; max-width:880px; line-height:1.5; }

  /* Ticket price cards */
  .tickets { margin-top:60px; display:grid; grid-template-columns:1fr 1fr; gap:22px; width:860px; }
  .ticket {
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.11);
    border-radius:28px; padding:30px 36px;
    display:flex; justify-content:space-between; align-items:center;
    backdrop-filter:blur(20px);
  }
  .ticket-dur { font-size:34px; font-weight:700; color:#fff; }
  .ticket-price { font-size:38px; font-weight:800; }
  .ticket:nth-child(1) .ticket-price { color:#fcd34d; }
  .ticket:nth-child(2) .ticket-price { color:#86efac; }
  .ticket:nth-child(3) .ticket-price { color:#93c5fd; }
  .ticket:nth-child(4) .ticket-price { color:#f9a8d4; }

  .phone-wrap { margin-top:60px; flex:1; display:flex; align-items:flex-end; justify-content:center; width:100%; position:relative; }
  .phone { position:relative; width:600px; }
  .phone-frame { background:#0f0f0f; border-radius:90px; padding:22px; border:2px solid rgba(255,255,255,0.12); box-shadow:0 40px 120px rgba(245,158,11,0.15),0 80px 200px rgba(0,0,0,0.9); }
  .phone-screen { border-radius:70px; overflow:hidden; aspect-ratio:9/19.5; background:#000; }
  .phone-screen img { width:100%; height:100%; object-fit:cover; display:block; }
  .phone-island { position:absolute; top:30px; left:50%; transform:translateX(-50%); width:175px; height:44px; background:#000; border-radius:28px; z-index:5; }
  .phone-glow { position:absolute; bottom:-40px; left:50%; transform:translateX(-50%); width:600px; height:180px; background:radial-gradient(ellipse,rgba(245,158,11,0.2) 0%,transparent 70%); }
</style>
</head>
<body>
  <div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grid"></div></div>
  <div class="content">
    <div class="badge"><span class="badge-dot"></span>SMS Jízdenky PID<span class="badge-dot"></span></div>
    <div class="headline">Jízdenka<br>za <em>3 sekundy.</em></div>
    <div class="sub">SMS na 90206 se předvyplní automaticky.<br>Jen potvrdíš odeslání.</div>
    <div class="tickets">
      <div class="ticket"><div class="ticket-dur">30 minut</div><div class="ticket-price">42 Kč</div></div>
      <div class="ticket"><div class="ticket-dur">90 minut</div><div class="ticket-price">55 Kč</div></div>
      <div class="ticket"><div class="ticket-dur">24 hodin</div><div class="ticket-price">150 Kč</div></div>
      <div class="ticket"><div class="ticket-dur">72 hodin</div><div class="ticket-price">350 Kč</div></div>
    </div>
    <div class="phone-wrap">
      <div class="phone">
        <div class="phone-frame">
          <div class="phone-island"></div>
          <div class="phone-screen"><img src="../src/iphone_tickets.png"/></div>
        </div>
        <div class="phone-glow"></div>
      </div>
    </div>
  </div>
</body>
</html>

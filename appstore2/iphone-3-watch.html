<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1290px; height:2796px; overflow:hidden; background:#070b0a; font-family:-apple-system,'Helvetica Neue',sans-serif; -webkit-font-smoothing:antialiased; position:relative; }
  .bg { position:absolute; inset:0; overflow:hidden; }
  .orb { position:absolute; border-radius:50%; filter:blur(140px); }
  .o1 { width:700px; height:700px; background:#00c853; opacity:0.18; top:-100px; left:-100px; }
  .o2 { width:600px; height:600px; background:#00897b; opacity:0.15; top:800px; right:-100px; }
  .o3 { width:500px; height:500px; background:#1b5e20; opacity:0.2; bottom:200px; left:200px; }
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(0,200,83,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,83,0.03) 1px,transparent 1px); background-size:80px 80px; }
  .content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; height:100%; }
  .badge { margin-top:130px; display:inline-flex; align-items:center; gap:12px; background:rgba(0,200,83,0.12); border:1px solid rgba(0,200,83,0.3); padding:12px 30px; border-radius:100px; font-size:26px; font-weight:700; letter-spacing:2px; color:#69f0ae; text-transform:uppercase; }
  .badge-dot { width:10px; height:10px; background:#00c853; border-radius:50%; }
  .headline { margin-top:50px; text-align:center; font-size:128px; font-weight:900; line-height:1.0; letter-spacing:-5px; color:#fff; max-width:1100px; }
  .headline em { font-style:normal; background:linear-gradient(135deg,#69f0ae 0%,#00c853 50%,#00e5ff 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .sub { margin-top:38px; font-size:40px; font-weight:400; color:rgba(255,255,255,0.65); text-align:center; max-width:880px; line-height:1.5; }

  /* Two devices side by side */
  .devices { margin-top:80px; flex:1; display:flex; align-items:flex-end; justify-content:center; gap:60px; width:100%; padding:0 60px 0; }

  /* Phone */
  .phone { position:relative; width:480px; }
  .phone-frame { background:#0f0f0f; border-radius:80px; padding:18px; border:2px solid rgba(255,255,255,0.12); box-shadow:0 40px 120px rgba(0,200,83,0.15),0 80px 200px rgba(0,0,0,0.9); }
  .phone-screen { border-radius:64px; overflow:hidden; aspect-ratio:9/19.5; background:#000; }
  .phone-screen img { width:100%; height:100%; object-fit:cover; display:block; }
  .phone-island { position:absolute; top:24px; left:50%; transform:translateX(-50%); width:140px; height:36px; background:#000; border-radius:22px; z-index:5; }

  /* Watch */
  .watch-wrap { display:flex; flex-direction:column; align-items:center; padding-bottom:60px; }
  .watch { position:relative; width:260px; }
  .watch-body { background:#0f0f0f; border-radius:56px; padding:14px; border:2px solid rgba(255,255,255,0.13); box-shadow:0 30px 80px rgba(0,200,83,0.2),0 60px 160px rgba(0,0,0,0.9); }
  .watch-screen { border-radius:42px; overflow:hidden; aspect-ratio:1/1.22; background:#000; }
  .watch-screen img { width:100%; height:100%; object-fit:cover; display:block; }
  .watch-crown { position:absolute; right:-10px; top:28%; width:10px; height:44px; background:#1a1a1a; border-radius:5px; border:1px solid rgba(255,255,255,0.08); }
  .watch-label { margin-top:28px; font-size:22px; font-weight:700; color:rgba(255,255,255,0.5); letter-spacing:2px; text-transform:uppercase; }

  .glow-bottom { position:absolute; bottom:0; left:0; right:0; height:300px; background:linear-gradient(to top, rgba(0,200,83,0.08), transparent); pointer-events:none; }
</style>
</head>
<body>
  <div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grid"></div></div>
  <div class="content">
    <div class="badge"><span class="badge-dot"></span>Apple Watch<span class="badge-dot"></span></div>
    <div class="headline">Na zápěstí.<br><em>Vždy včas.</em></div>
    <div class="sub">Odjezdy, přestupy a navigace<br>přímo z Apple Watch. Bez telefonu.</div>
    <div class="devices">
      <div class="phone">
        <div class="phone-frame">
          <div class="phone-island"></div>
          <div class="phone-screen"><img src="../src/iphone_home2.png"/></div>
        </div>
      </div>
      <div class="watch-wrap">
        <div class="watch">
          <div class="watch-body">
            <div class="watch-crown"></div>
            <div class="watch-screen"><img src="../src/watch_journey_en.png"/></div>
          </div>
        </div>
        <div class="watch-label">Apple Watch</div>
      </div>
    </div>
  </div>
  <div class="glow-bottom"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1290px; height:2796px; overflow:hidden; background:#09070f; font-family:-apple-system,'Helvetica Neue',sans-serif; -webkit-font-smoothing:antialiased; position:relative; }
  .bg { position:absolute; inset:0; overflow:hidden; }
  .orb { position:absolute; border-radius:50%; filter:blur(140px); }
  .o1 { width:800px; height:800px; background:#7c3aed; opacity:0.22; top:-150px; right:-100px; }
  .o2 { width:600px; height:600px; background:#db2777; opacity:0.15; top:600px; left:-100px; }
  .o3 { width:500px; height:500px; background:#4f46e5; opacity:0.18; bottom:300px; right:100px; }
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(124,58,237,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,0.04) 1px,transparent 1px); background-size:80px 80px; }
  .content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; height:100%; }
  .badge { margin-top:130px; display:inline-flex; align-items:center; gap:12px; background:rgba(124,58,237,0.15); border:1px solid rgba(124,58,237,0.35); padding:12px 30px; border-radius:100px; font-size:26px; font-weight:700; letter-spacing:2px; color:#c4b5fd; text-transform:uppercase; }
  .badge-dot { width:10px; height:10px; background:#7c3aed; border-radius:50%; }
  .headline { margin-top:50px; text-align:center; font-size:120px; font-weight:900; line-height:1.0; letter-spacing:-5px; color:#fff; max-width:1100px; }
  .headline em { font-style:normal; background:linear-gradient(135deg,#c4b5fd 0%,#a855f7 50%,#ec4899 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .sub { margin-top:38px; font-size:40px; font-weight:400; color:rgba(255,255,255,0.65); text-align:center; max-width:880px; line-height:1.5; }

  /* Dynamic Island highlight card */
  .di-card {
    margin-top:56px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
    border-radius:36px; padding:36px 56px;
    display:flex; align-items:center; gap:40px;
    backdrop-filter:blur(20px); max-width:900px;
  }
  .di-island { width:180px; height:52px; background:#000; border-radius:30px; border:2px solid rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0; }
  .di-dot { width:14px; height:14px; background:#E8001D; border-radius:50%; }
  .di-time { font-size:26px; font-weight:700; color:#fff; }
  .di-text { font-size:30px; font-weight:500; color:rgba(255,255,255,0.8); line-height:1.4; }
  .di-text strong { color:#fff; font-weight:700; }

  .phone-wrap { margin-top:60px; flex:1; display:flex; align-items:flex-end; justify-content:center; width:100%; position:relative; }
  .phone { position:relative; width:600px; }
  .phone-frame { background:#0f0f0f; border-radius:90px; padding:22px; border:2px solid rgba(255,255,255,0.12); box-shadow:0 40px 120px rgba(124,58,237,0.2),0 80px 200px rgba(0,0,0,0.9); }
  .phone-screen { border-radius:70px; overflow:hidden; aspect-ratio:9/19.5; background:#000; }
  .phone-screen img { width:100%; height:100%; object-fit:cover; display:block; }
  .phone-island { position:absolute; top:30px; left:50%; transform:translateX(-50%); width:175px; height:44px; background:#000; border-radius:28px; z-index:5;
    box-shadow:0 0 0 3px rgba(124,58,237,0.5), 0 0 30px rgba(124,58,237,0.4); }
  .phone-glow { position:absolute; bottom:-40px; left:50%; transform:translateX(-50%); width:600px; height:180px; background:radial-gradient(ellipse,rgba(124,58,237,0.25) 0%,transparent 70%); }
</style>
</head>
<body>
  <div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grid"></div></div>
  <div class="content">
    <div class="badge"><span class="badge-dot"></span>Live Activity<span class="badge-dot"></span></div>
    <div class="headline">Odjezd<br>v <em>dohledu.</em><br>Vždy.</div>
    <div class="sub">Dynamic Island odpočítává sekundy.<br>Notifikace 2 minuty před odjezdem.</div>
    <div class="di-card">
      <div class="di-island">
        <div class="di-dot"></div>
        <div class="di-time">1:22</div>
      </div>
      <div class="di-text"><strong>Linka 24</strong> → Vozovna Kobylisy<br>odjezd za <strong>1 min 22 s</strong></div>
    </div>
    <div class="phone-wrap">
      <div class="phone">
        <div class="phone-frame">
          <div class="phone-island"></div>
          <div class="phone-screen"><img src="../src/iphone_home2.png"/></div>
        </div>
        <div class="phone-glow"></div>
      </div>
    </div>
  </div>
</body>
</html>
